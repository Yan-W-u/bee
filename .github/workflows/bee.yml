name: bee

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  self-check:
    name: 单元测试 + 规则 benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 单元测试
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/bee-unittest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # 把失败摘要写进 annotation，否则日志只能登录网页看
            detail=$(grep -E '^(FAIL|ERROR):' -A 6 /tmp/bee-unittest.log | tr '\n' '~' | head -c 1200)
            echo "::error title=单元测试失败::${detail}"
            tail -40 /tmp/bee-unittest.log
            exit "$rc"
          fi

      - name: 规则 benchmark（有 FN/FP 则失败）
        run: python benchmark/run.py --strict

  scan:
    name: 漏洞扫描
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 首次运行生成基线
        run: |
          if [ ! -f .bee-baseline.json ]; then
            echo "::notice::未找到基线文件，本次扫描全量写入 .bee-baseline.json。下载 artifact 并提交它之后，后续只报新增问题。"
            set +e
            python -m bee scan . --write-baseline .bee-baseline.json --sarif bee.sarif --detector rules \
              --exclude 'samples/**' --exclude 'benchmark/cases/**' --exclude 'tests/**' --exclude 'examples/**' \
              2>&1 | tee /tmp/bee-scan.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              detail=$(tail -25 /tmp/bee-scan.log | tr '\n' '~' | head -c 1200)
              echo "::error title=扫描失败::${detail}"
              exit "$rc"
            fi
            echo "BOOTSTRAP=1" >> "$GITHUB_ENV"
          fi

      - name: 只报新增问题
        if: env.BOOTSTRAP != '1'
        env:
          BEE_LLM_API_KEY: ${{ secrets.BEE_LLM_API_KEY }}
        run: |
          # 有 API Key 时开启可解释性分析与补丁验证；没有则只做规则检测
          # 用数组传参：拼成字符串再展开会让 bash 把 ** 当通配符，argparse 收到多余参数
          ARGS=(--baseline .bee-baseline.json --sarif bee.sarif --detector rules
                --exclude 'samples/**' --exclude 'benchmark/cases/**'
                --exclude 'tests/**' --exclude 'examples/**')
          set +e
          if [ -n "$BEE_LLM_API_KEY" ]; then
            python -m bee audit . "${ARGS[@]}" 2>&1 | tee /tmp/bee-scan.log
          else
            python -m bee scan . --fail-on-new "${ARGS[@]}" 2>&1 | tee /tmp/bee-scan.log
          fi
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            detail=$(tail -25 /tmp/bee-scan.log | tr '\n' '~' | head -c 1200)
            echo "::error title=扫描失败(exit $rc)::${detail}"
            exit "$rc"
          fi

      - name: 上传 SARIF 到 Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bee.sarif
          category: bee

      - name: 保留报告与基线
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bee-sarif
          path: |
            bee.sarif
            .bee-baseline.json
          retention-days: 14

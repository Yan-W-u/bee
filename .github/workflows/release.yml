name: release

# 打 tag 时自动构建 wheel/sdist 并挂到 GitHub Release。
# 所有 action 固定到 commit SHA（供应链要求）；Dependabot 会定期提 PR 更新。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: 构建
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: 在干净 venv 里验证安装
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/bee --version
          /tmp/verify/bin/bee scan . --detector rules --exclude 'tests/**' > /dev/null || true

      - name: 挂到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
          generate_release_notes: true
          # 正文由 GitHub 按提交自动生成；想用 CHANGELOG 的版本可以直接编辑替换
          fail_on_unmatched_files: true

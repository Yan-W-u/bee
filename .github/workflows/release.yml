name: release

# 打 tag 时自动构建 wheel/sdist 并挂到 GitHub Release。
# 所有 action 固定到 commit SHA（供应链要求）；Dependabot 会定期提 PR 更新。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: 构建
        run: |
          set +e
          python -m pip install --upgrade build 2>&1 | tail -3
          python -m build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            detail=$(tail -20 /tmp/build.log | tr '\n' '~' | head -c 1200)
            echo "::error title=构建失败::${detail}"
            exit "$rc"
          fi

      - name: 校验 wheel 内容
        run: |
          # PEP 561：classifier 声明了 Typing :: Typed，wheel 里就必须真的有
          # py.typed，否则下游 mypy/pyright 依然当这个包没有类型信息。
          # 这条断言是「声明 = 实现」的机器检查，本地没有 setuptools 时查不了。
          set +e
          python -m zipfile -l dist/*.whl > /tmp/whl.txt
          if ! grep -q 'bee/py.typed' /tmp/whl.txt; then
            echo "::error title=wheel 缺少 bee/py.typed::PEP 561 标记没打进包，检查 [tool.setuptools.package-data]"
            exit 1
          fi
          echo "py.typed 已在 wheel 中"

      - name: 在干净 venv 里验证安装
        run: |
          set +e
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl 2>&1 | tee /tmp/verify.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=wheel 安装失败::$(tail -15 /tmp/verify.log | tr '\n' '~' | head -c 1000)"
            exit "$rc"
          fi
          /tmp/verify/bin/bee --version
          /tmp/verify/bin/bee scan . --detector rules --exclude 'tests/**' > /dev/null

      - name: 挂到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
          generate_release_notes: true
          # 正文由 GitHub 按提交自动生成；想用 CHANGELOG 的版本可以直接编辑替换
          fail_on_unmatched_files: true

  <!-- 蜜蜂 5 (右下) -->
  <g transform="translate(38, 34)">
    <ellipse cx="4" cy="3.5" rx="3" ry="2" fill="#FCD34D"/>
    <line x1="4" y1="1.5" x2="2.5" y2="0" stroke="#1E293B" stroke-width="0.5"/>
    <line x1="4" y1="1.5" x2="5.5" y2="0" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="5.5" cy="3" r="0.5" fill="#1E293B"/>
  </g>

  <!-- 飞行轨迹 -->
  <path d="M22 20 Q28 16 34 18" stroke="#F59E0B" stroke-width="0.4" fill="none" opacity="0.4" stroke-dasharray="2 2"/>
  <path d="M38 18 Q42 26 38 32" stroke="#F59E0B" stroke-width="0.4" fill="none" opacity="0.4" stroke-dasharray="2 2"/>
  <path d="M22 34 Q26 30 32 30" stroke="#F59E0B" stroke-width="0.4" fill="none" opacity="0.4" stroke-dasharray="2 2"/>

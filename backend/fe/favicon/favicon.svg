<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 蜂巢六边形背景 -->
  <path d="M32 4L56 18V46L32 60L8 46V18L32 4Z" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <path d="M32 10L50 20.5V41.5L32 52L14 41.5V20.5L32 10Z" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.3"/>

  <!-- 蜜蜂 1 (左上) -->
  <g transform="translate(20, 18)">
    <ellipse cx="5" cy="4" rx="3.5" ry="2.2" fill="#FBBF24"/>
    <line x1="5" y1="1.8" x2="3" y2="0" stroke="#1E293B" stroke-width="0.5"/>
    <line x1="5" y1="1.8" x2="7" y2="0" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="6.8" cy="3.5" r="0.6" fill="#1E293B"/>
  </g>

  <!-- 蜜蜂 2 (右上) -->
  <g transform="translate(36, 16)">
    <ellipse cx="4" cy="4" rx="3" ry="2" fill="#FCD34D"/>
    <line x1="4" y1="2" x2="2.5" y2="0.5" stroke="#1E293B" stroke-width="0.5"/>
    <line x1="4" y1="2" x2="5.5" y2="0.5" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="5.5" cy="3.5" r="0.5" fill="#1E293B"/>
  </g>

  <!-- 蜜蜂 3 (中下) -->
  <g transform="translate(28, 30)">
    <ellipse cx="4.5" cy="4" rx="3.2" ry="2" fill="#F59E0B"/>
    <line x1="4.5" y1="2" x2="2.8" y2="0.5" stroke="#1E293B" stroke-width="0.5"/>
    <line x1="4.5" y1="2" x2="6.2" y2="0.5" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="6" cy="3.5" r="0.5" fill="#1E293B"/>
  </g>

  <!-- 蜜蜂 4 (左下) -->
  <g transform="translate(18, 32)">
    <ellipse cx="4" cy="3.5" rx="2.8" ry="1.8" fill="#FBBF24"/>
    <line x1="4" y1="1.7" x2="2.5" y2="0.3" stroke="#1E293B" stroke-width="0.5"/>
    <line x1="4" y1="1.7" x2="5.5" y2="0.3" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="5.3" cy="3" r="0.5" fill="#1E293B"/>

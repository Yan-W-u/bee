[project]
name = "bee"
version = "0.1.0"
description = "漏洞检测 + 可解释性修复 + 机器验证补丁"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bee = "bee.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bee*"]

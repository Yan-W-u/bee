[project]
# PyPI 上 `bee` 已被 2012 年的包占用，发行名用 bee-scanner；
# 命令行仍然是 `bee`，import 包名也仍然是 bee。
name = "bee-scanner"
version = "1.2.0"
description = "漏洞检测 + 可解释性修复 + 机器验证补丁"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
keywords = ["security", "sast", "llm", "vulnerability", "sarif", "appsec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Yan-W-u/bee"
Repository = "https://github.com/Yan-W-u/bee"
Issues = "https://github.com/Yan-W-u/bee/issues"
Changelog = "https://github.com/Yan-W-u/bee/blob/main/CHANGELOG.md"

[project.scripts]
bee = "bee.cli:main"

[build-system]
# PEP 639 的 license/license-files 是 setuptools 77 才支持的
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bee*"]

[tool.setuptools.package-data]
# PEP 561：不带这个文件时下游 mypy / pyright 会认为包没有类型信息，
# 即使 classifier 里写了 Typing :: Typed
bee = ["py.typed"]
